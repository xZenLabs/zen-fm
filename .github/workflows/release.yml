name: Stable release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag (for example v1.0.0)
        required: true
        type: string
      qemu_run_id:
        description: Successful Old-kernel QEMU qualification run ID
        required: true
        type: string
      kindle4_run_id:
        description: Successful physical Kindle 4 qualification run ID
        required: true
        type: string
      kindle5_run_id:
        description: Successful physical Kindle 5 qualification run ID
        required: true
        type: string
      paperwhite1_run_id:
        description: Successful physical Paperwhite 1 qualification run ID
        required: true
        type: string

permissions:
  contents: read
  checks: read
  attestations: read

concurrency:
  group: stable-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Verify stable-release evidence
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate stable tag and source version
        id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}' VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$TAG" = "v$version"
          git show-ref --verify --quiet "refs/tags/$TAG"
          commit=$(git rev-parse 'HEAD^{commit}')
          test "$commit" = "$(git rev-parse "$TAG^{commit}")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists" >&2
            exit 1
          fi
      - name: Require CI, security, and CodeQL checks for the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | [.name, .status, .conclusion, .app.slug, .completed_at] | @tsv' \
            > "$RUNNER_TEMP/check-runs.tsv"
          for required in \
            'CI required checks' \
            'Security required checks' \
            'Analyze go' \
            'Analyze javascript-typescript' \
            'Analyze java-kotlin'; do
            awk -F '\t' -v required="$required" \
              '$1 == required && $2 == "completed" && $3 == "success" && \
               $4 == "github-actions" && $5 != "" { found = 1 } \
               END { exit found ? 0 : 1 }' \
              "$RUNNER_TEMP/check-runs.tsv" || {
                echo "required successful check is missing: $required" >&2
                exit 1
              }
          done
      - name: Download successful protected qualification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/fetch-release-evidence.sh \
            "$GITHUB_REPOSITORY" \
            '${{ github.event.repository.default_branch }}' \
            '${{ steps.source.outputs.commit }}' \
            '${{ inputs.qemu_run_id }}' \
            '${{ inputs.kindle4_run_id }}' \
            '${{ inputs.kindle5_run_id }}' \
            '${{ inputs.paperwhite1_run_id }}' \
            evidence
      - name: Verify evidence semantics and GitHub provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/verify-release-evidence.sh '${{ steps.source.outputs.commit }}' evidence
          for evidence_file in evidence/*.json; do
            gh attestation verify "$evidence_file" --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-release-evidence
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 90

  frontend:
    name: Build release frontend
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-frontend
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  legacy-arm:
    name: Build legacy ARM backends
    needs: [evidence, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Bootstrap reviewed Go 1.26.5 old-kernel compiler from pinned source
        run: |
          sh scripts/verify-legacy-toolchain.sh
          sh toolchains/legacy/bootstrap.sh "$RUNNER_TEMP/go1.26.5-kindle"
      - name: Cross-compile soft- and hard-float backends
        env:
          VERSION: ${{ needs.evidence.outputs.version }}
        run: |
          set -eu
          mkdir -p .release/bin
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 \
            "$RUNNER_TEMP/go1.26.5-kindle/bin/go" build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-hf ./cmd/zenfm
          GOOS=linux GOARCH=arm GOARM=5 CGO_ENABLED=0 \
            "$RUNNER_TEMP/go1.26.5-kindle/bin/go" build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-sf ./cmd/zenfm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-legacy-arm
          path: .release/bin
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Build Linux KOReader backends
    needs: [evidence, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Cross-compile amd64 and arm64
        env:
          VERSION: ${{ needs.evidence.outputs.version }}
        run: |
          set -eu
          mkdir -p .release/bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-linux-amd64 ./cmd/zenfm
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-linux-arm64 ./cmd/zenfm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: .release/bin
          if-no-files-found: error
          retention-days: 3

  macos:
    name: Build universal macOS KOReader backend
    needs: [evidence, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Build and merge amd64 and arm64 slices
        env:
          VERSION: ${{ needs.evidence.outputs.version }}
        run: |
          set -eu
          mkdir -p .release/bin
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/zenfm-darwin-amd64 ./cmd/zenfm
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/zenfm-darwin-arm64 ./cmd/zenfm
          lipo -create -output .release/bin/zenfm-darwin \
            .release/zenfm-darwin-amd64 .release/zenfm-darwin-arm64
          lipo -verify_arch x86_64 arm64 .release/bin/zenfm-darwin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: .release/bin
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build signed Android companion
    needs: [evidence, frontend]
    environment: stable-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.6'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Restore the Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zenfm-release.p12"
          test -s "$RUNNER_TEMP/zenfm-release.p12"
          chmod 600 "$RUNNER_TEMP/zenfm-release.p12"
      - name: Compile, test, and sign both Android ABIs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/zenfm-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
          GRADLE_BIN=gradle sh android/build.sh testReleaseUnitTest
          apksigner verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

  package:
    name: Sign and publish stable release
    needs: [evidence, legacy-arm, linux, macos, android]
    environment: stable-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-legacy-arm
          path: .release/bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux
          path: .release/bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos
          path: .release/bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-android-apk
          path: .release/apk
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stable-release-evidence
          path: evidence
      - name: Produce only the four KOReader bundles and companion APK
        run: |
          apk=$(find .release/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          sh scripts/verify-qualified-binaries.sh evidence .release/bin
          sh build.sh --package-only .release/bin --apk "$apk"
          sh scripts/verify-release-assets.sh dist '${{ needs.evidence.outputs.version }}'
      - name: Generate release SBOM
        run: mkdir -p metadata
      - name: Scan release source and dependencies
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: metadata/zenfm-${{ needs.evidence.outputs.version }}.spdx.json
          upload-artifact: false
      - name: Attest every published ZenFM artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Attest release SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: metadata/*.spdx.json
      - name: Retain release SBOM outside updater assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ needs.evidence.outputs.version }}
          path: metadata/*.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/* evidence/*.json \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ needs.evidence.outputs.commit }}' \
            --verify-tag \
            --title "ZenFM $TAG" \
            --generate-notes
