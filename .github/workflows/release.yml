name: Stable release
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: stable-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prerequisites:
    name: Verify stable-release prerequisites
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate stable tag and source version
        id: source
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}' VERSION)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$TAG" = "v$version"
          git show-ref --verify --quiet "refs/tags/$TAG"
          commit=$(git rev-parse 'HEAD^{commit}')
          test "$commit" = "$(git rev-parse "$TAG^{commit}")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists" >&2
            exit 1
          fi
      - name: Require CI, security, and CodeQL checks for the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -eu
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?filter=latest&per_page=100" \
            --jq '.check_runs[] | [.name, .status, .conclusion, .app.slug, .completed_at] | @tsv' \
            > "$RUNNER_TEMP/check-runs.tsv"
          for required in \
            'CI required checks' \
            'Security required checks' \
            'Analyze go' \
            'Analyze javascript-typescript' \
            'Analyze java-kotlin'; do
            awk -F '\t' -v required="$required" \
              '$1 == required && $2 == "completed" && $3 == "success" && \
               $4 == "github-actions" && $5 != "" { found = 1 } \
               END { exit found ? 0 : 1 }' \
              "$RUNNER_TEMP/check-runs.tsv" || {
                echo "required successful check is missing: $required" >&2
                exit 1
              }
          done
  frontend:
    name: Build release frontend
    needs: prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-frontend
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  legacy-arm:
    name: Build legacy ARM backends
    needs: [prerequisites, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Bootstrap reviewed Go 1.26.5 old-kernel compiler from pinned source
        run: |
          sh scripts/verify-legacy-toolchain.sh
          sh toolchains/legacy/bootstrap.sh "$RUNNER_TEMP/go1.26.5-kindle"
      - name: Cross-compile soft- and hard-float backends
        env:
          VERSION: ${{ needs.prerequisites.outputs.version }}
        run: |
          set -eu
          mkdir -p .release/bin
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 \
            "$RUNNER_TEMP/go1.26.5-kindle/bin/go" build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-hf ./cmd/zenfm
          GOOS=linux GOARCH=arm GOARM=5 CGO_ENABLED=0 \
            "$RUNNER_TEMP/go1.26.5-kindle/bin/go" build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-sf ./cmd/zenfm
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-legacy-arm
          path: .release/bin
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Build Linux KOReader backends
    needs: [prerequisites, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Cross-compile amd64 and arm64
        env:
          VERSION: ${{ needs.prerequisites.outputs.version }}
        run: |
          set -eu
          mkdir -p .release/bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-linux-amd64 ./cmd/zenfm
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/bin/zenfm-linux-arm64 ./cmd/zenfm
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-linux
          path: .release/bin
          if-no-files-found: error
          retention-days: 3

  macos:
    name: Build universal macOS KOReader backend
    needs: [prerequisites, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Build and merge amd64 and arm64 slices
        env:
          VERSION: ${{ needs.prerequisites.outputs.version }}
        run: |
          set -eu
          mkdir -p .release/bin
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/zenfm-darwin-amd64 ./cmd/zenfm
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -buildid= -X main.version=$VERSION" \
            -o .release/zenfm-darwin-arm64 ./cmd/zenfm
          lipo -create -output .release/bin/zenfm-darwin \
            .release/zenfm-darwin-amd64 .release/zenfm-darwin-arm64
          lipo -verify_arch x86_64 arm64 .release/bin/zenfm-darwin
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos
          path: .release/bin
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build signed Android companion
    needs: [prerequisites, frontend]
    environment: stable-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.6'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-frontend
          path: .release/frontend
      - run: sh scripts/stage-webui.sh .release/frontend
      - name: Restore the Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zenfm-release.p12"
          test -s "$RUNNER_TEMP/zenfm-release.p12"
          chmod 600 "$RUNNER_TEMP/zenfm-release.p12"
      - name: Compile, test, and sign both Android ABIs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/zenfm-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653" GRADLE_BIN=gradle sh android/build.sh testReleaseUnitTest
          apksigner verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

  package:
    name: Sign and publish stable release
    needs: [prerequisites, legacy-arm, linux, macos, android]
    environment: stable-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-legacy-arm
          path: .release/bin
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-linux
          path: .release/bin
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-macos
          path: .release/bin
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-android-apk
          path: .release/apk
      - name: Produce only the four KOReader bundles and companion APK
        run: |
          apk=$(find .release/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          sh build.sh --package-only .release/bin --apk "$apk"
          sh scripts/verify-release-assets.sh dist '${{ needs.prerequisites.outputs.version }}'
      - name: Attest every published ZenFM artifact
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ needs.prerequisites.outputs.commit }}' \
            --verify-tag \
            --title "ZenFM $TAG" \
            --generate-notes
