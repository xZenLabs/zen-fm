name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - run: go vet ./...

  go-race:
    name: Go race tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - run: go test -race -count=1 ./...

  go-fuzz:
    name: Go fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Exercise path canonicalization fuzz target
        run: go test ./internal/files -run='^$' -fuzz='^FuzzNormalize$' -fuzztime=30s -parallel=2
      - name: Exercise bounded HTML sanitizer fuzz target
        run: go test ./internal/server -run='^$' -fuzz='^FuzzSanitizeHTML$' -fuzztime=30s -parallel=2
      - name: Exercise archive-name fuzz target
        run: go test ./internal/server -run='^$' -fuzz='^FuzzArchiveNameValidation$' -fuzztime=15s -parallel=2
      - name: Exercise upload-metadata fuzz target
        run: go test ./internal/server -run='^$' -fuzz='^FuzzUploadMetadataParser$' -fuzztime=15s -parallel=2

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run frontend checks
        run: npm test
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  plugin:
    name: KOReader plugin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Lua and packaging tools
        run: sudo apt-get update && sudo apt-get install -y jq lua5.1 lua-filesystem shellcheck zip unzip openssl
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            sh -n "$file"
          done < <(find build.sh android plugin scripts tests toolchains -type f -name '*.sh' -print | sort)
      - name: Run shellcheck
        shell: bash
        run: |
          set -euo pipefail
          find build.sh android plugin scripts tests toolchains -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x --severity=error
      - name: Run Lua, supervisor, and package-layout tests
        run: sh tests/plugin/run.sh

  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.6'
      - name: Install Android SDK and pinned NDK
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
      - name: Compile both Android ABIs and run JVM tests
        env:
          ZENFM_ANDROID_DEV_UNSIGNED: '1'
        run: GRADLE_BIN=gradle sh android/build.sh testDebugUnitTest

  package-builds:
    name: Build and verify development packages
    needs: frontend
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.6'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-dist
          path: .release/frontend
      - name: Stage the tested frontend for Go embedding
        run: sh scripts/stage-webui.sh .release/frontend
      - name: Install Android SDK and pinned NDK
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
      - name: Build and verify cross-platform development packages
        env:
          ZENFM_ANDROID_DEV_UNSIGNED: '1'
        run: |
          sh scripts/verify-legacy-toolchain.sh
          sh build.sh --dev-unsigned
          version=$(sed -n '1p' VERSION)
          sh scripts/verify-release-assets.sh dist "$version"
      - name: Upload development packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: development-installable-packages
          path: |
            dist/ZenFM-koreader-ereader-*.zip
            dist/ZenFM-koreader-linux-*.zip
            dist/ZenFM-koreader-macos-*.zip
            dist/ZenFM-koreader-android-*.zip
            dist/ZenFM-android-*.apk
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI required checks
    if: always()
    needs: [go-vet, go-race, go-fuzz, frontend, plugin, android, package-builds]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate
        env:
          GO_VET: ${{ needs.go-vet.result }}
          GO_RACE: ${{ needs.go-race.result }}
          GO_FUZZ: ${{ needs.go-fuzz.result }}
          FRONTEND: ${{ needs.frontend.result }}
          PLUGIN: ${{ needs.plugin.result }}
          ANDROID: ${{ needs.android.result }}
          PACKAGES: ${{ needs.package-builds.result }}
        run: |
          test "$GO_VET" = success
          test "$GO_RACE" = success
          test "$GO_FUZZ" = success
          test "$FRONTEND" = success
          test "$PLUGIN" = success
          test "$ANDROID" = success
          test "$PACKAGES" = success
