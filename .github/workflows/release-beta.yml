name: Beta release

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare beta release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, 'ci-skip')
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      publish: ${{ steps.source.outputs.publish }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Wait for CI and resolve the next beta version
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_version=$(sed -n '1{s/^[[:space:]]*//;s/[[:space:]]*$//;p;}' VERSION)
          base_version=$(printf '%s\n' "$source_version" | sed 's/-beta[0-9][0-9]*$//')
          [[ "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          commit=$(git rev-parse 'HEAD^{commit}')
          base="v$base_version"

          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          latest=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --json tagName \
            --jq '.[].tagName' \
            | sed -n 's/^v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\(-beta[0-9][0-9]*\)\{0,1\}$/\1/p' \
            | sort -V \
            | tail -n 1)
          if [ -n "$latest" ]; then
            lower=$(printf '%s\n%s\n' "$base_version" "$latest" | sort -V | head -n 1)
            if [ "$lower" = "$base_version" ] && [ "$base_version" != "$latest" ]; then
              echo "Version $base_version is lower than current release $latest; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          number=1
          while gh release view "${base}-beta${number}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            git show-ref --verify --quiet "refs/tags/${base}-beta${number}"; do
            number=$((number + 1))
          done
          beta_version="${base_version}-beta${number}"

          deadline=$((SECONDS + 1800))
          while :; do
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?filter=latest&per_page=100" \
              --jq '.check_runs[] | [.name, .status, .conclusion, .app.slug, .completed_at] | @tsv' \
              > "$RUNNER_TEMP/check-runs.tsv"
            status=$(awk -F '\t' \
              '$1 == "CI required checks" && $4 == "github-actions" { print $2; exit }' \
              "$RUNNER_TEMP/check-runs.tsv")
            conclusion=$(awk -F '\t' \
              '$1 == "CI required checks" && $4 == "github-actions" { print $3; exit }' \
              "$RUNNER_TEMP/check-runs.tsv")
            completed_at=$(awk -F '\t' \
              '$1 == "CI required checks" && $4 == "github-actions" { print $5; exit }' \
              "$RUNNER_TEMP/check-runs.tsv")
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ] || [ -z "$completed_at" ]; then
                echo "CI required checks failed: $conclusion" >&2
                exit 1
              fi
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timed out waiting for CI required checks" >&2
              exit 1
            fi
            echo "waiting for CI required checks"
            sleep 15
          done

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=v$beta_version" >> "$GITHUB_OUTPUT"
          echo "version=$beta_version" >> "$GITHUB_OUTPUT"

  release:
    name: Build and release beta
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: beta-release
    runs-on: macos-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Stamp beta version
        run: printf '%s\n' '${{ needs.prepare.outputs.version }}' > VERSION

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.1
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.6'

      - name: Install Android SDK and pinned NDK
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Restore the Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -D > "$RUNNER_TEMP/zenfm-release.p12"
          test -s "$RUNNER_TEMP/zenfm-release.p12"
          chmod 600 "$RUNNER_TEMP/zenfm-release.p12"

      - name: Build and verify beta assets
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/zenfm-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GRADLE_BIN: gradle
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          sh scripts/verify-legacy-toolchain.sh
          sh build.sh
          sh scripts/verify-release-assets.sh dist "$VERSION"
          apksigner verify --verbose --print-certs "dist/ZenFM-android-$VERSION.apk"

      - name: Attest every published ZenFM beta artifact
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

      - name: Create prerelease and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ needs.prepare.outputs.commit }}' \
            --title "ZenFM $TAG" \
            --generate-notes \
            --prerelease
